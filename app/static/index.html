<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Terminator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-play" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M10 8.5v7l5.5-3.5z"/></symbol>
  <symbol id="icon-image" viewBox="0 0 24 24"><circle cx="10" cy="6" r="3"/><path d="M3 20c2-6 6-6 8-3s5 2 7-1l3 4z"/></symbol>
  <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-4 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M8 10h8"/></symbol>
  <symbol id="icon-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="icon-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="icon-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M14 4v16M9 10l2 2-2 2"/></symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4zM17 9a5 5 0 0 1 0 6M19 5a9 9 0 0 1 0 14"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</svg>

<div class="frame"><div class="app">
  <main class="main">
    <button class="menu" id="menu" type="button" aria-label="Open menu" aria-controls="side">
      <svg class="i" aria-hidden="true"><use href="#icon-menu"/></svg>
    </button>
    <div class="stage" id="stage">
      <section class="welcome" id="welcome" aria-labelledby="welcome-title">
        <img class="welcome-logo" src="/terminator-emblem.png" alt="" width="182" height="182">
        <h1 id="welcome-title">Terminator is on a mission: Find your next obsession.</h1>
        <p>Let's find the movie you won't stop thinking about .</p>
      </section>
      <div class="thread hide" id="thread" aria-live="polite" aria-relevant="additions text"></div>
    </div>
    <div class="dock">
      <form class="composer" id="composer">
        <textarea id="input" rows="2" placeholder="Your next obsession starts here..." aria-label="Message" autocomplete="off"></textarea>
        <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
        <div class="attachments hide" id="attachments" aria-live="polite"></div>
        <div class="tools">
          <button class="round send" id="send" type="submit" aria-label="Send message" title="Send message">
            <svg class="i" aria-hidden="true"><use href="#icon-send"/></svg>
          </button>
          <div class="right">
            <button class="round" id="mic" type="button" aria-label="Start voice input" aria-pressed="false" title="Start voice input">
              <svg class="i" aria-hidden="true"><use href="#icon-mic"/></svg>
            </button>
            <button class="round" id="attach" type="button" aria-label="Attach images" title="Attach images">
              <svg class="i" aria-hidden="true"><use href="#icon-link"/></svg>
            </button>
          </div>
        </div>
      </form>
      <div class="chips" id="chips" aria-label="Suggested prompts">
        <button class="chip" type="button" data-prompt="Find me latest trendy Funny and witty movies"><span>Funny and witty</span><svg class="i" aria-hidden="true"><use href="#icon-play"/></svg></button>
        <button class="chip" type="button" data-prompt="Find me latest trendy Dark and futuristic movies"><span>Dark and futuristic</span><svg class="i" aria-hidden="true"><use href="#icon-play"/></svg></button>
        <button class="chip" type="button" data-prompt="Give a list of top 10 A mind-bending thriller movies"><span>A mind-bending thriller</span><svg class="i" aria-hidden="true"><use href="#icon-image"/></svg></button>
        <button class="chip" type="button" data-prompt="Find me latest trendy Elegant and cinematic movies"><span>Elegant and cinematic</span><svg class="i" aria-hidden="true"><use href="#icon-play"/></svg></button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <aside class="side" id="side" aria-label="Conversation navigation">
    <div class="top">
      <div class="side-tools">
        <button id="collapse" type="button" aria-label="Close sidebar" title="Close sidebar"><svg class="i" aria-hidden="true"><use href="#icon-panel"/></svg></button>
        <button id="search-btn" type="button" aria-label="Search conversations" title="Search conversations"><svg class="i" aria-hidden="true"><use href="#icon-search"/></svg></button>
      </div>
      <div class="brand"><img src="/terminator-emblem.png" alt="" width="24" height="24">Terminator</div>
    </div>
    <nav class="nav" aria-label="Chat actions">
      <button class="new" id="new" type="button"><svg class="i" aria-hidden="true"><use href="#icon-chat"/></svg><span>New conversation</span></button>
      <button id="images" type="button" aria-label="Ask about an image"><svg class="i" aria-hidden="true"><use href="#icon-image"/></svg><span>Images</span></button>
    </nav>
    <h2 class="recent-h" id="recent-heading">Recent conversations</h2>
    <input class="find hide" id="find" type="search" placeholder="Search" aria-label="Search conversations" aria-controls="recent">
    <div class="recent" id="recent" role="list" aria-labelledby="recent-heading"></div>
    <div class="profile" id="profile" aria-live="polite">
      <button class="mood-toggle" id="mood-toggle" type="button" role="switch" aria-checked="false" aria-label="Change Mood">
        <span>Change Mood</span>
        <span class="mood-switch-track" aria-hidden="true">
          <span class="mood-switch-thumb">
            <svg class="mood-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
            <svg class="mood-moon" viewBox="0 0 24 24"><path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.5 8.5 0 1 0 20.4 15.1Z"/></svg>
          </span>
        </span>
      </button>
      <div id="profile-user" class="hide">
        <strong id="profile-name"></strong>
        <div class="profile-meta">
          <span id="profile-email"></span>
          <a href="/api/auth/logout" id="logout-link">Sign out</a>
        </div>
      </div>
      <div id="profile-login" class="profile-login hide">
        <strong>Sign in / Sign up</strong>
        <a class="profile-login-link" href="/api/auth/google/login">Sign in with Google</a>
        <a class="profile-login-link" href="/api/auth/github/login">Sign in with GitHub</a>
        <button class="profile-login-link profile-guest-link" id="guest-login-side" type="button">Continue as Guest</button>
      </div>
    </div>
  </aside>
</div></div>
<dialog class="signin-modal" id="signin-modal" aria-labelledby="signin-title">
  <div class="signin-modal-content">
    <button class="signin-close" id="signin-close" type="button" aria-label="Close sign-in prompt">×</button>
    <h2 id="signin-title">Sign in to save your conversations</h2>
    <nav class="signin-options" aria-label="Sign in options">
      <a class="signin-provider google" href="/api/auth/google/login">Sign in with Google</a>
      <a class="signin-provider github" href="/api/auth/github/login">Sign in with GitHub</a>
      <button class="signin-provider guest" id="guest-login-modal" type="button">Continue as Guest</button>
    </nav>
    <button class="signin-later" id="signin-later" type="button">Maybe later</button>
  </div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
